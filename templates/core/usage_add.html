{% extends 'base.html' %}

{% block title %}
Add Fabric Usage | Fabric Factory
{% endblock %}

{% block content %}

<h1>Add Fabric Usage</h1>

<p>
    <a href="{% url 'usage_list' %}">
        ← Back to Usage Records
    </a>
</p>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Save Usage
    </button>
</form>

{% endblock %}
